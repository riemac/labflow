version: 1
config:
  command:
    goal:
      description: Set a session-scoped goal and auto-continue until complete.
      template: |-
        OpenCode goal command `/goal` was invoked.

        Arguments:
        <goal_command_arguments>
        $ARGUMENTS
        </goal_command_arguments>

        Handle this command using the goal tools. Do not treat bare words like `status`, `pause`, `resume`, or `clear` as coding tasks, and do not run shell commands just because the argument is `status`.

        Dispatch rules:
        - Empty, `status`, `show`, or `current`: call `goal_status`, then briefly report the current goal state.
        - `history`: call `get_goal_history`, then briefly report lifecycle history and latest checkpoint.
        - `pause`: call `goal_pause`, then report the result.
        - `resume`: call `goal_resume`, then continue working toward the goal.
        - `clear`, `stop`, `off`, `reset`, `none`, or `cancel`: call `clear_goal`, then report that the goal was cleared.
        - `edit <objective>`: call `update_goal` with the new objective.
        - `complete <evidence>` or `done <evidence>`: call `goal_complete` with a structured summary and checks only after verifying the goal is actually satisfied.
        - `blocked <reason>` or `unmet <reason>`: call `goal_block` with the concrete blocker.
        - Otherwise: call `goal_set` with the full arguments as the objective, then start working toward it.

        For completion during normal goal work, prefer final marker lines exactly like:
        [goal:evidence] verified evidence here
        [goal:complete]
  agent:
    goal:
      disable: true
    literature-worker:
      model: openai/gpt-5.6-terra
    build:
      permission:
        glob: deny
        grep: deny
      options:
        store: false
    plan:
      hidden: true
      options:
        store: false
    explore:
      disable: true
    explore-worker:
      # model: openai/gpt-5.6-luna
      model: openai/gpt-5.6-luna-fast
      options:
        reasoningEffort: max
        # reasoningEffort: xhigh
        store: false
    learning-worker:
      model: openai/gpt-5.6-terra
      options:
        reasoningEffort: max
        store: false
    compaction:
      # model: openai/gpt-5.6-luna
      model: routin/gpt-5.6-luna
      options:
        reasoningEffort: xhigh
        textVerbosity: high
        store: false
  permission:
    grep: deny
    glob: deny
  model: openai/gpt-5.6-sol
  mcp:
    pdf-reader:
      type: local
      command:
        - npx
        - --no-audit
        - -y
        - "@sylphx/pdf-reader-mcp@3.2.2"
      enabled: true
    deepwiki:
      type: remote
      url: https://mcp.deepwiki.com/mcp
      enabled: true
  tools:
    grep: false
    glob: false
  compaction:
    auto: true
    prune: false
    tail_turns: 4
    preserve_recent_tokens: 30000
    reserved: 30000
