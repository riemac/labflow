version: 1
config:
  command:
    goal:
      description: Set a session-scoped goal and auto-continue until complete.
      template: |-
        OpenCode goal command `/goal` was invoked.

        Arguments:
        <goal_command_arguments>
        $ARGUMENTS
        </goal_command_arguments>

        Handle this command using the goal tools. Do not treat bare words like `status`, `pause`, `resume`, or `clear` as coding tasks, and do not run shell commands just because the argument is `status`.

        Dispatch rules:
        - Empty, `status`, `show`, or `current`: call `get_goal`, then briefly report the current goal state.
        - `history`: call `get_goal_history`, then briefly report lifecycle history and latest checkpoint.
        - `pause`: call `update_goal` with status `paused`, then report the result.
        - `resume`: call `update_goal` with status `resumed`, then continue working toward the goal.
        - `clear`, `stop`, `off`, `reset`, `none`, or `cancel`: call `clear_goal`, then report that the goal was cleared.
        - `edit <objective>`: call `update_goal` with the new objective.
        - `complete <evidence>` or `done <evidence>`: call `update_goal` with status `complete` and evidence only after checking the goal is actually satisfied.
        - `blocked <reason>` or `unmet <reason>`: call `update_goal` with status `blocked` and blocker.
        - Otherwise: call `set_goal` with the full arguments as the objective, then start working toward it.

        For completion during normal goal work, prefer final marker lines exactly like:
        [goal:evidence] verified evidence here
        [goal:complete]
  agent:
    literature-worker:
      model: lucoo/gpt-5.6-terra
    build:
      options:
        store: false
    plan:
      hidden: true
      options:
        store: false
    explore:
      disable: true
    general:
      disable: true
    explore-worker:
      model: routin/gpt-5.6-luna
      options:
        reasoningEffort: xhigh
        store: false
    compaction:
      model: routin/gpt-5.6-luna
      prompt: Create a high-fidelity session checkpoint. Do not reduce the amount of information merely because concise bullets are requested. Fully preserve the user's goals, constraints, key decisions and their rationale, failed attempts, technical facts, exact paths, symbols, commands, errors, test results, unresolved questions, and next steps. Do not merge distinct facts into vague descriptions. Remove information from an existing summary only when it has been explicitly superseded. Strictly follow the requested output structure, and do not answer the original conversation.
      options:
        reasoningEffort: high
        store: false
  permission:
    grep: deny
    glob: deny
  model: openai/gpt-5.6-sol
  mcp:
    pdf-reader:
      type: local
      command:
        - npx
        - --prefer-online
        - -y
        - "@sylphx/pdf-reader-mcp@3"
      enabled: true
    deepwiki:
      type: remote
      url: https://mcp.deepwiki.com/mcp
      enabled: true
  tools:
    grep: false
    glob: false
  compaction:
    auto: true
    prune: false
    tail_turns: 4
    preserve_recent_tokens: 15000
    reserved: 10000
