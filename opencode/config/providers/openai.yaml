version: 1
id: openai
config:
  options:
    baseURL: https://api.routin.ai/plan/v1
    headerTimeout: 60000
  whitelist:
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna
  models:
    gpt-5.6-sol:
      name: GPT-5.6 Sol
      options:
        reasoningEffort: xhigh
        reasoningSummary: auto
        textVerbosity: low
        include:
          - reasoning.encrypted_content
        store: false
      limit:
        context: 272000
        input: 272000
        output: 64000
      variants:
        none:
          disabled: true
        low:
          reasoningEffort: low
          reasoningSummary: auto
        medium:
          reasoningEffort: medium
          reasoningSummary: auto
        high:
          reasoningEffort: high
          reasoningSummary: auto
        xhigh:
          reasoningEffort: xhigh
          reasoningSummary: auto
        max:
          reasoningEffort: max
          reasoningSummary: auto
    gpt-5.6-terra:
      name: GPT-5.6 Terra
      options:
        reasoningEffort: xhigh
        reasoningSummary: auto
        textVerbosity: low
        include:
          - reasoning.encrypted_content
        store: false
      limit:
        context: 372000
        input: 372000
        output: 64000
      variants:
        none:
          disabled: true
        low:
          reasoningEffort: low
          reasoningSummary: auto
        medium:
          reasoningEffort: medium
          reasoningSummary: auto
        high:
          reasoningEffort: high
          reasoningSummary: auto
        xhigh:
          reasoningEffort: xhigh
          reasoningSummary: auto
        max:
          reasoningEffort: max
          reasoningSummary: auto
    gpt-5.6-luna:
      name: GPT-5.6 Luna
      options:
        reasoningEffort: xhigh
        reasoningSummary: auto
        textVerbosity: low
        include:
          - reasoning.encrypted_content
        store: false
      limit:
        context: 372000
        input: 372000
        output: 64000
      variants:
        none:
          disabled: true
        low:
          reasoningEffort: low
          reasoningSummary: auto
        medium:
          reasoningEffort: medium
          reasoningSummary: auto
        high:
          reasoningEffort: high
          reasoningSummary: auto
        xhigh:
          reasoningEffort: xhigh
          reasoningSummary: auto
        max:
          reasoningEffort: max
          reasoningSummary: auto
auth:
  default:
    secret: routin-plan
    header: Authorization
    prefix: "Bearer "
