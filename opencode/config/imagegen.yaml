version: 1
defaultRoute: openai-pro-first
profiles:
  openai-pro-codex:
    provider: openai
    api: codex
    coordinatorModel: gpt-5.5
    model: gpt-image-2
    size: auto
    quality: high
    outputFormat: png
    outDir: figures/imagegen
    timeoutMs: 300000
  lucoo-gpt-image-2:
    provider: lucoo
    api: images
    baseURL: https://api.lucoo.net/v1
    model: gpt-image-2
    secret: lucoo-gpt-authorization
    size: 3840x2160
    quality: high
    outputFormat: png
    outDir: figures/imagegen
    timeoutMs: 180000
  gmn-gpt-image-2:
    provider: gmn
    api: images
    baseURL: https://gmn.chuangzuoli.com/v1
    model: gpt-image-2
    secret: gmn
    size: 3840x2160
    quality: high
    outputFormat: png
    outDir: figures/imagegen
    timeoutMs: 180000
  routin-plan-responses:
    provider: routin-plan
    api: responses
    baseURL: https://api.routin.ai/plan/v1
    model: gpt-5.6-sol
    secret: routin-plan
    size: 3840x2160
    quality: high
    outputFormat: png
    outDir: figures/imagegen
    timeoutMs: 180000
routes:
  openai-pro-first:
    profiles:
      - openai-pro-codex
      - lucoo-gpt-image-2
      - gmn-gpt-image-2
    fallbackOnAmbiguousTimeout: false
  relay-first:
    profiles:
      - lucoo-gpt-image-2
      - gmn-gpt-image-2
      - openai-pro-codex
    fallbackOnAmbiguousTimeout: false
  preferred:
    profiles:
      - lucoo-gpt-image-2
      - gmn-gpt-image-2
    fallbackOnAmbiguousTimeout: false
